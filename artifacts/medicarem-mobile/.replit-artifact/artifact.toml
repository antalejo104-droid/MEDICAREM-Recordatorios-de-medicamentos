kind = "mobile"
previewPath = "/medicarem-mobile/"
title = "MEDICAREM Móvil"
description = "Aplicación móvil para que personas mayores organicen medicamentos, reciban recordatorios locales, registren tomas u omisiones declaradas y sincronicen sus eventos con el panel autorizado de cuidadores."
version = "1.0.0"
id = "artifacts/medicarem-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/medicarem-mobile/" ]
localPort = 24366

[services.development]
run = "pnpm --filter @workspace/medicarem-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medicarem-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/medicarem-mobile", "run", "serve" ]

[services.env]
PORT = "24366"
BASE_PATH = "/medicarem-mobile/"
